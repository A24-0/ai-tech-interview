# Stack of the stand: docker compose --env-file .env up -d (from the deploy/ directory).
# The sandbox image is built separately, see deploy/README.md.
# The web image needs client/build/web: flutter build web --release --dart-define=API_BASE_URL=/api
name: ai-tech-interview

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  # REST API: applies migrations, loads the question bank (idempotent) and serves /api.
  api:
    build: ../server
    image: ${SERVER_IMAGE:-interview-server:latest}
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && python -m app.scripts.import_bank content/seed/python_basics.json content/tasks/python_basics.json
        && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file: .env
    volumes:
      - ../content:/srv/content:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [backend, edge]
    restart: unless-stopped

  # Static Flutter web client and the /api proxy: the only service published to the outside.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: ${WEB_IMAGE:-interview-web:latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  # Background worker: takes code runs from the queue in PostgreSQL and starts sandbox
  # containers through docker-socket-proxy. Same image as the API, different command.
  worker:
    build: ../server
    image: ${SERVER_IMAGE:-interview-server:latest}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks: [backend, sandbox-control]
    restart: unless-stopped
    # SIGTERM: the worker stops taking runs and finishes the ones in progress.
    stop_grace_period: 30s

  # The only service that sees the Docker socket. It lets through container calls only
  # (create/start/attach/wait/kill/remove); images, volumes, networks and exec are denied.
  # Not published and reachable only from the worker over the internal network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sandbox-control]
    restart: unless-stopped

networks:
  backend:
  edge:
  sandbox-control:
    internal: true

volumes:
  pgdata:
