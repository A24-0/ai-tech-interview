[project]
name = "ai-tech-interview-server"
version = "0.1.0"
description = "AI Tech Interview: API, background worker, AI layer and sandbox adapters"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "docker>=7.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "types-docker>=7.1",
    "types-requests>=2.31",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.infrastructure.ai" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: needs a running Docker daemon and the sandbox image",
    "db: needs PostgreSQL (TEST_DATABASE_URL), skipped when it is unreachable",
]
